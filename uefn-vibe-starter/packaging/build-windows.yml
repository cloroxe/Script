# Modele GitHub Actions : construit les EXE sur un runner Windows (aucun Python requis chez toi).
# A copier dans .github/workflows/build-windows.yml, puis Actions > build-windows-exe > Run workflow.
name: build-windows-exe
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build EXE
        working-directory: uefn-vibe-starter
        shell: cmd
        run: packaging\build_exe.bat
      - uses: actions/upload-artifact@v4
        with:
          name: uefn-vibe-starter-windows
          path: uefn-vibe-starter/dist/*.exe
